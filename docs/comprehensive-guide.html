        let currentPhase = 0;
        
        function renderPhase(index) {
            const phase = phases[index];
            const timeline = document.getElementById('timeline');
            const content = document.getElementById('content');
            
            document.getElementById('progressBar').style.width = ((index + 1) / phases.length) * 100 + '%';
            
            timeline.innerHTML = phases.map((p, i) => `
                <div class="phase ${i === index ? 'active' : ''}" onclick="goToPhase(${i})">
                    <div class="phase-number">${i + 1}</div>
                    <div class="phase-title">${p.title}</div>
                    <div class="phase-duration">${p.duration}</div>
                </div>
            `).join('');
            
            content.innerHTML = `<div class="phase-content active">${phase.content}</div>`;
            
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === phases.length - 1;
        }
        
        function nextPhase() {
            if (currentPhase < phases.length - 1) {
                currentPhase++;
                renderPhase(currentPhase);
                document.querySelector('.content').scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        function previousPhase() {
            if (currentPhase > 0) {
                currentPhase--;
                renderPhase(currentPhase);
                document.querySelector('.content').scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        function goToPhase(index) {
            currentPhase = index;
            renderPhase(currentPhase);
        }
        
        renderPhase(0);
    </script>
